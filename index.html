<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Impulse 2026</title>
  <style>
    html,body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: auto;
      height: auto;

      max-width: 583px;
      max-height: 863px;

      max-width: min(583px, calc(100vw - 16px));
      max-height: min(863px, calc(100vh - 16px));

      -webkit-user-drag: none;
      user-select: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="impulse.png" alt="Impulse 2026">
  </div>
</body>
</html>
